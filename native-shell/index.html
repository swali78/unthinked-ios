<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unthinked</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0c; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      .orb { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #4FA3B8 0%, #E9C99F 55%, #C9785A 100%); box-shadow: 0 0 40px rgba(79,163,184,.45); }
      h1 { font-size: 22px; font-weight: 500; margin: 8px 0 0; }
      p { margin: 0; color: rgba(255,255,255,.6); font-size: 15px; line-height: 1.4; max-width: 280px; }
      button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 15px; background: #fff; color: #0b0b0c; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Unthinked needs a connection to find flights, stays and visas. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
